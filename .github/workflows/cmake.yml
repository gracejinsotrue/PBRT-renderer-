name: Build

# nori-dxr is a D3D12/DXR renderer: it links d3d12/dxgi/dxguid and compiles its
# shaders with dxc, so there is nothing for Linux or macOS to build. The 3-OS
# matrix inherited from upstream nori failed at the CMake configure step on
# every push since the port, so this builds the one platform that can.
on: [push]

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: Windows Latest - MSVC
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Create Build Environment
      run: cmake -E make_directory ${{github.workspace}}/build

    # The OIDN SDK is a local unzip rather than a submodule, so CI builds
    # without the denoiser. Everything else, the DXR shaders included, still
    # gets compiled.
    - name: Configure CMake
      shell: bash
      working-directory: ${{github.workspace}}/build
      run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DNORI_ENABLE_OIDN=OFF

    - name: Build
      working-directory: ${{github.workspace}}/build
      shell: bash
      run: cmake --build . --config $BUILD_TYPE --parallel
